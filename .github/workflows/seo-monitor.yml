name: SEO checks
# Build-time SEO checks on every PR, plus a weekly crawl of the live site.
# Read-only: this workflow never deploys or modifies production.
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Lead-form email backend (Cloud Function)
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
      - run: npm --prefix functions test
      - run: npm run build
      - run: npm run test:seo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-check-report
          path: seo-reports/

  live-checks:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/seo-live-check.mjs https://aeseller.com
